spring:
  application:
    name: broker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/broker}
    username: ${DB_USER:broker}
    password: ${DB_PASSWORD:broker}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

broker:
  dispatcher:
    poll-interval-ms: 500
    batch-size: 100
  retry:
    max-attempts: 5
    backoff-seconds: [1, 5, 30, 120, 600]

server:
  port: ${PORT:8080}

logging:
  level:
    com.example.broker: DEBUG
