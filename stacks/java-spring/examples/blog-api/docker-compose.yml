version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: blog_api_postgres
    environment:
      POSTGRES_DB: blog_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"   # host 5433 to avoid clashing with a local Postgres on 5432
    volumes:
      - blog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blog_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: blog_api_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - blog_network
    profiles:
      - tools

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog_api_app
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/blog_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: change-in-production-please-use-a-long-random-string
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blog_network
    profiles:
      - app

volumes:
  blog_postgres_data:
    driver: local

networks:
  blog_network:
    driver: bridge
