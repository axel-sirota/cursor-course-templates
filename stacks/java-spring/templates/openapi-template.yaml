openapi: 3.0.0
info:
  title: Your Project API
  description: Spring Boot project with authentication and layered architecture
  version: 1.0.0
  contact:
    name: API Support
    email: support@yourproject.com

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.yourproject.com
    description: Production server

tags:
  - name: Health
    description: Health check endpoints (Spring Boot Actuator)
  - name: Authentication
    description: User authentication and authorization
  - name: Resources
    description: Resource management

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Health Check
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: UP

    # Authentication
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - fullName
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: securepassword123
        fullName:
          type: string
          example: John Doe

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: securepassword123

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9...
        user:
          $ref: '#/components/schemas/UserResponse'

    UserResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-0000000000aa
        email:
          type: string
          example: user@example.com
        fullName:
          type: string
          example: John Doe

    # Resources (placeholder — replace with your domain entities)
    CreateResourceRequest:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: My First Resource
        description:
          type: string
          minLength: 1
          maxLength: 10000
          example: This is the description of my first resource.

    ResourceResponse:
      type: object
      properties:
        resourceId:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000123
        name:
          type: string
          example: My First Resource
        description:
          type: string
          example: This is the description of my first resource.
        ownerId:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-0000000000aa
        createdAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00Z
        updatedAt:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00Z

    ResourceListResponse:
      type: object
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceResponse'
        totalCount:
          type: integer
          example: 100
        hasMore:
          type: boolean
          example: true

    UpdateResourceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Updated Resource Name
        description:
          type: string
          minLength: 1
          maxLength: 10000
          example: Updated description

    # Error Responses — mirrors Spring's ProblemDetail (RFC 7807)
    ErrorResponse:
      type: object
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Resource Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: Resource not found

paths:
  /actuator/health:
    get:
      summary: Health check
      description: Spring Boot Actuator health endpoint
      tags:
        - Health
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/auth/register:
    post:
      summary: Register new user
      description: Create a new user account
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      summary: User login
      description: Authenticate user and issue a JWT
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /api/resources:
    post:
      summary: Create resource
      description: Create a new resource (placeholder — rename to your domain entity)
      tags:
        - Resources
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceRequest'
      responses:
        '200':
          description: Resource created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: List resources
      description: Get list of resources with pagination
      tags:
        - Resources
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: List of resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceListResponse'

  /api/resources/{resourceId}:
    get:
      summary: Get resource
      description: Get a single resource by ID
      tags:
        - Resources
      security:
        - bearerAuth: []
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resource details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update resource
      description: Update an existing resource
      tags:
        - Resources
      security:
        - bearerAuth: []
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourceRequest'
      responses:
        '200':
          description: Resource updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete resource
      description: Delete a resource
      tags:
        - Resources
      security:
        - bearerAuth: []
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Resource deleted successfully
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
