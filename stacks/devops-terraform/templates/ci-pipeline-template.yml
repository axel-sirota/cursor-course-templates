# ci-pipeline-template.yml
#
# Copy this file to .github/workflows/terraform.yml and adjust:
#   - AWS_REGION / TF_VERSION
#   - role-to-assume ARN (the OIDC deploy role from modules/cicd)
#   - working-directory if your root module isn't the repo root
#
# Stage order: fmt-check -> validate -> tflint -> checkov -> plan (PR comment)
#              -> manual-approval gate -> apply (main only) -> post-apply smoke check

name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tfvars"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.8"
  AWS_REGION: "us-east-1"
  AWS_DEPLOY_ROLE_ARN: "arn:aws:iam::123456789012:role/acme-github-actions"

jobs:
  fmt-and-validate:
    name: fmt-check + validate + tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init (no backend, syntax-only)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4

      - name: tflint --init
        run: tflint --init

      - name: tflint
        run: tflint --recursive

  checkov:
    name: checkov policy scan
    runs-on: ubuntu-latest
    needs: fmt-and-validate
    steps:
      - uses: actions/checkout@v4

      - name: Run checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          config_file: .checkov.yaml
          quiet: true
          soft_fail: false

  plan:
    name: terraform plan (PR comment)
    runs-on: ubuntu-latest
    needs: checkov
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        run: terraform init

      - name: terraform plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan | tee plan_output.txt
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const maxLen = 60000;
            let plan = fs.readFileSync('plan_output.txt', 'utf8');
            if (plan.length > maxLen) {
              plan = plan.slice(0, maxLen) + '\n... (truncated)';
            }
            const body = `### Terraform Plan\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  apply:
    name: terraform apply (protected branch, manual approval)
    runs-on: ubuntu-latest
    needs: checkov
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        run: terraform init

      - name: terraform plan
        run: terraform plan -out=tfplan

      - name: terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Post-apply smoke check
        run: |
          aws ecs describe-services \
            --cluster "$(terraform output -raw ecs_cluster_name)" \
            --services "$(terraform output -raw ecs_service_name)" \
            --query 'services[0].{running:runningCount,desired:desiredCount,status:status}' \
            --output table
