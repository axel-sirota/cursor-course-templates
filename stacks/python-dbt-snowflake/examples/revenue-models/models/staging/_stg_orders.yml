version: 2

models:
  - name: stg_orders
    description: >
      Staged orders, 1:1 with raw.ecommerce.orders. Columns renamed to snake_case,
      types cast, and nulls handled. No joins or aggregations. One row per order.
    columns:
      - name: order_id
        description: >
          Unique identifier for a placed order, sourced from the id column in the
          transactional orders table. Never reused after cancellation.
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: >
          Foreign key referencing the customer who placed this order.
          Sourced from customer_id in the transactional orders table.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id

      - name: order_date
        description: >
          Date the order was placed, cast from the created_at timestamp to DATE.
          Used as the primary date dimension for revenue reporting.
        data_tests:
          - not_null

      - name: updated_at
        description: >
          Timestamp of the last update to this order record in the source system.
          Used as the incremental filter key in downstream fact models.
        data_tests:
          - not_null

      - name: status
        description: >
          Current fulfillment status of the order. Valid values are placed, shipped,
          completed, and cancelled. Sourced from the status column in the transactional orders table.
        data_tests:
          - not_null
          - accepted_values:
              values: ['placed', 'shipped', 'completed', 'cancelled']

      - name: total_amount_cents
        description: >
          Total order value in US cents including all items, before discounts.
          Divide by 100 to get dollar value.
        data_tests:
          - not_null

      - name: discount_amount_cents
        description: >
          Total discount applied to this order in US cents.
          Zero if no discount was applied.

      - name: is_deleted
        description: >
          Boolean flag indicating whether this order has been soft-deleted in the
          source system. Defaults to FALSE when the source column is null.
        data_tests:
          - not_null
