apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {app-name}-appset
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: dev
            url: https://dev.k8s.example.com
            values_file: values-dev.yaml
          - cluster: staging
            url: https://staging.k8s.example.com
            values_file: values-staging.yaml
          - cluster: prod
            url: https://prod.k8s.example.com
            values_file: values-prod.yaml
  template:
    metadata:
      name: "{app-name}-{{cluster}}"
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/{org}/{repo}
        targetRevision: main
        path: charts/{chart-name}
        helm:
          valueFiles:
            - values.yaml
            - "{{values_file}}"
      destination:
        server: "{{url}}"
        namespace: {app-namespace}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
