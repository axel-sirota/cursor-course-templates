# Staging environment overrides
# All values not listed here inherit from values.yaml

replicaCount: 2

image:
  # Explicit git SHA tag — never use "latest" in staging
  tag: "abc1234"
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
  hosts:
    - host: webapp-staging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: webapp-staging-tls
      hosts:
        - webapp-staging.example.com
